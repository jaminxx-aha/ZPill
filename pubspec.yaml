name: z_pill
description: 相机无线遥控与传输工具 —— iOS / Android / HarmonyOS 三端通用。
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0

# Flutter SDK:HarmonyOS 端使用 OpenHarmony-SIG 维护的 flutter_flutter fork
# (见 README「环境准备」),iOS/Android 用官方 SDK,同一份 lib/ 代码。

dependencies:
  flutter:
    sdk: flutter
  # 框架自带组件(菜单/日期选择等)内置文案的本地化(i18n 第一期);
  # intl 由它传递自带,不显式加依赖/钉版本。
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # 图像解码/编码(纯 Dart):监看辅助直方图/斑马纹(WP6)、水印与
  # XMP 注入的 JPEG 重编码(WP9/10)、图库编辑滤镜(WP11)。
  image: ^4.3.0

  # ── 按里程碑引入,骨架期不预支 ─────────────────────────────────
  # P1 后台下载(Android WorkManager 等价): workmanager
  # P2 已配对相机持久化(Room 等价):        drift
  # P2 设置(DataStore 等价):              shared_preferences
  # P2 缩略图缓存:                          cached_network_image / extended_image
  # P3 BLE(iOS/Android):                   flutter_blue_plus(ohos 需在 ArkTS 侧自写 channel)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  yaml: ^3.1.3

flutter:
  uses-material-design: true
  # 取景「高质量」上采样/时域降噪(Catmull-Rom fragment shader)。
  shaders:
    - shaders/feed_quality.frag
  # 应用统一字体(Inter 4.1,SIL OFL 1.1,随包):iOS 观感近似替身 ——
  # SF 本体是苹果专有字体,许可不允许提取打包/跨平台分发;默认字体是
  # 平台各自的(iOS=SF/ohos=HarmonyOS Sans),度量差百分之几,同一份
  # 代码双端观感永远差一口气 —— 全 app 钉随包字体,同字体同排版逐像
  # 素同源。四字重对应 Material 用档(400 正文/500 按钮标签/600 M3
  # 标题/700 粗体);汉字 Inter 无字形走系统回落(iOS=PingFang/ohos=
  # HarmonyOS Sans),要连汉字同源需另打 CJK 字体(体量大,未做)。
  fonts:
    - family: InterBadge
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    # 汉字同源回落:Inter 无 CJK 字形,中文回落到 Noto Sans SC(SIL
    # OFL)—— 按应用实际用字子集化(1637 字,原 VF 17.8MB;子集外生僻
    # 字/文件名走系统回落,与旧行为一致)。VF 经 fonttools instancer
    # 出四档静态字重(与 Inter 同 400/500/600/700 档),不依赖引擎可变
    # 字体支持。
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-400.ttf
        - asset: assets/fonts/NotoSansSC-500.ttf
          weight: 500
        - asset: assets/fonts/NotoSansSC-600.ttf
          weight: 600
        - asset: assets/fonts/NotoSansSC-700.ttf
          weight: 700
