name: Android Device CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-device-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Build, install, and launch
    runs-on: [self-hosted, android]
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build, install, and launch
        env:
          ANDROID_PACKAGE: ${{ vars.ANDROID_PACKAGE }}
          ANDROID_ACTIVITY: ${{ vars.ANDROID_ACTIVITY }}
        run: bash tools/android_device_smoke.sh
